services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./fullchain.pem:/etc/nginx/fullchain.pem:ro
      # - ./privkey.pem:/etc/nginx/privkey.pem:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - aivana-network

  backend:
    build:
      context: ./backend-aivana
      dockerfile: Dockerfile
    container_name: backend
    env_file: ./backend-aivana/.env
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - minio
    restart: unless-stopped
    networks:
      - aivana-network
      
  frontend:
    build:
      context: ./frontend-aivana
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://bscit.sit.kmutt.ac.th/capstone25/cp25ssi3/api
    container_name: frontend
    env_file: ./frontend-aivana/.env
    ports:
      - "3000:3000" 
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aivana-network

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - aivana-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    command: server /data --console-address ":9090"
    env_file: ./.env
    ports:
      - "9000:9000" # s3 api
      - "9090:9090" # console
    volumes:
      - ./services/minio/data:/data
      - ./services/minio/config:/root/.minio
    restart: unless-stopped
    networks:
      - aivana-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0 
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - aivana-network

volumes:
  postgres_data:

networks:
  aivana-network:

